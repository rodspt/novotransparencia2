listen_addresses: '0.0.0.0:3000'
route_prefix: /tiles

postgres:
  connection_string: ${DATABASE_URL}
  pool_size: 40
  # Publica apenas o que está listado abaixo (nada de expor tabelas por engano).
  auto_publish: false
  # Gerado a partir de geo.camada (zoom mínimo real é controlado pela função e pelo mapa).
  functions:
    municipio_resumo:
      schema: tiles
      function: municipio_resumo
      minzoom: 0
      maxzoom: 22
    uf_limite:
      schema: tiles
      function: uf_limite
      minzoom: 0
      maxzoom: 22
    bioma:
      schema: tiles
      function: bioma
      minzoom: 0
      maxzoom: 22
    faixa_fronteira:
      schema: tiles
      function: faixa_fronteira
      minzoom: 0
      maxzoom: 22
    sicar:
      schema: tiles
      function: sicar
      minzoom: 0
      maxzoom: 22
    sigef:
      schema: tiles
      function: sigef
      minzoom: 0
      maxzoom: 22
    assentamento:
      schema: tiles
      function: assentamento
      minzoom: 0
      maxzoom: 22
    area_urbana:
      schema: tiles
      function: area_urbana
      minzoom: 0
      maxzoom: 22
    terra_indigena:
      schema: tiles
      function: terra_indigena
      minzoom: 0
      maxzoom: 22
    quilombola:
      schema: tiles
      function: quilombola
      minzoom: 0
      maxzoom: 22
    floresta_publica:
      schema: tiles
      function: floresta_publica
      minzoom: 0
      maxzoom: 22
    area_militar:
      schema: tiles
      function: area_militar
      minzoom: 0
      maxzoom: 22
    deter:
      schema: tiles
      function: deter
      minzoom: 0
      maxzoom: 22
    embargo_ibama:
      schema: tiles
      function: embargo_ibama
      minzoom: 0
      maxzoom: 22
    embargo_icmbio:
      schema: tiles
      function: embargo_icmbio
      minzoom: 0
      maxzoom: 22
    embargo_estadual:
      schema: tiles
      function: embargo_estadual
      minzoom: 0
      maxzoom: 22
    minerio:
      schema: tiles
      function: minerio
      minzoom: 0
      maxzoom: 22
    reserva_garimpeira:
      schema: tiles
      function: reserva_garimpeira
      minzoom: 0
      maxzoom: 22
    uso_solo:
      schema: tiles
      function: uso_solo
      minzoom: 0
      maxzoom: 22
    qualidade_pastagem:
      schema: tiles
      function: qualidade_pastagem
      minzoom: 0
