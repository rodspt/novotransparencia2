worker_processes auto;

events {
    worker_connections 4096;
}

http {
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Cache de tiles em disco. A URL inclui ?v=<versao da camada>, então uma nova carga
    # gera URLs novas e o cache antigo simplesmente expira (inactive).
    proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:200m
                     max_size=50g inactive=30d use_temp_path=off;

    # DNS interno do Docker, resolvido a cada requisição (via variáveis no proxy_pass):
    # recriar um container (novo IP) não deixa o gateway apontando para o endereço antigo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location /tiles/ {
            set $martin http://martin:3000;
            proxy_pass $martin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache tiles;
            proxy_cache_key "$uri$is_args$args";
            proxy_cache_valid 200 204 30d;
            proxy_cache_valid 404 1m;
            # Várias requisições ao mesmo tile frio => uma só vai ao PostGIS.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 30s;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache $upstream_cache_status always;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location /api/ {
            set $api http://api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            set $web http://web:3000;
            proxy_pass $web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
